name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Build and Push Docker Images
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A. Authenticate to GitHub Container Registry (for Backend)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # B. Authenticate to Google Artifact Registry (for Frontend)
      - name: Log in to Google Artifact Registry
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # C. Build and push Backend Docker image to GHCR
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # D. Build and push Frontend Docker image (Next.js) to GAR
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
          tags: |
            ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_GAR_REPO || 'voice-platform' }}/frontend:latest
            ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_GAR_REPO || 'voice-platform' }}/frontend:${{ github.sha }}

  # ============================================================================
  # Stage 2: Deployment (Runs after image builds finish successfully)
  # ============================================================================
  deploy:
    name: Deploy Services
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Frontend to Cloud Run (from Google Artifact Registry)
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: voice-platform-frontend
          image: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_GAR_REPO || 'voice-platform' }}/frontend:latest
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          env_vars: |
            NODE_ENV=production
            PORT=8080

      - name: Trigger Remote Backend Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_SSH_USER }}
          key: ${{ secrets.GCE_SSH_KEY }}
          port: ${{ secrets.GCE_SSH_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.PROJECT_PATH || '/opt/voice-orchestration-platform' }}"
            cd "${TARGET_DIR}"

            # Login to GHCR on the target VM to allow pulling private package images
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

            echo "Ensuring deployment scripts are executable..."
            chmod +x scripts/*.sh

            echo "Executing production deploy..."
            if ! ./scripts/deploy.sh; then
              echo "Deployment failed! Initiating emergency rollback..."
              ./scripts/rollback.sh
              exit 1
            fi

            echo "Running post-deployment health validation..."
            ./scripts/health.sh
